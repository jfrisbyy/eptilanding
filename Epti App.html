<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Epti — Active Protocol</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;450;500;600;700&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
/* =========================================================
   EPTI — Mobile app screens (Home + Compound Detail)
   Design width: 390px (iPhone). No status bar — content only.
   ========================================================= */

:root {
  --sans: 'Geist', system-ui, -apple-system, sans-serif;
  --serif: 'Fraunces', Georgia, serif;
  --mono: 'JetBrains Mono', ui-monospace, monospace;

  /* Surface */
  --bg:        oklch(0.965 0.008 95);  /* soft warm off-white */
  --bg-deep:   oklch(0.93  0.012 95);  /* page edge */
  --card:      oklch(0.985 0.005 95);
  --card-tint: oklch(0.965 0.012 165); /* faint mint card */
  --card-warn: oklch(0.965 0.025 60);  /* faint orange card */
  --line:      oklch(0.88  0.012 95 / 0.6);
  --line-soft: oklch(0.88  0.012 95 / 0.4);

  /* Ink */
  --ink:    oklch(0.18 0.012 250);
  --ink-2:  oklch(0.40 0.012 250);
  --ink-3:  oklch(0.60 0.010 250);
  --ink-4:  oklch(0.72 0.008 250);

  /* Accent — Epti teal */
  --teal:        oklch(0.74 0.13 175);
  --teal-deep:   oklch(0.60 0.13 175);
  --teal-ink:    oklch(0.42 0.12 175);
  --teal-tint:   oklch(0.95 0.04 175);
  --teal-line:   oklch(0.82 0.07 175);

  /* Compound greens (BPC liquid) */
  --green:       oklch(0.74 0.18 150);
  --green-deep:  oklch(0.58 0.16 150);
  --green-ink:   oklch(0.42 0.14 150);
  --green-tint:  oklch(0.95 0.05 150);

  /* Warn (refill orange) */
  --warn:       oklch(0.72 0.15 65);
  --warn-ink:   oklch(0.55 0.14 65);
  --warn-tint:  oklch(0.96 0.04 65);

  /* Phase progress */
  --ph-1: oklch(0.78 0.10 175);
  --ph-2: oklch(0.74 0.10 240);
  --ph-3: oklch(0.86 0.04 95);
  --ph-4: oklch(0.78 0.13 65);
  --ph-5: oklch(0.55 0.02 250);

  --r-xl: 26px;
  --r-lg: 20px;
  --r-md: 14px;
  --r-sm: 10px;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--sans);
  color: var(--ink);
  background:
    radial-gradient(120% 80% at 50% 0%, oklch(0.95 0.02 175 / 0.5), transparent 60%),
    var(--bg-deep);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

/* Page frame — keeps the design centered on desktop */
.stage {
  min-height: 100vh;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding: 24px 16px 80px;
}
@media (max-width: 480px) {
  .stage { padding: 0; }
}

.device {
  width: 390px;
  max-width: 100%;
  position: relative;
  background: var(--bg);
  border-radius: 38px;
  overflow: hidden;
  box-shadow:
    0 1px 0 oklch(1 0 0 / 0.5) inset,
    0 30px 60px -30px oklch(0.18 0.03 175 / 0.25),
    0 12px 30px -16px oklch(0.18 0.03 175 / 0.18);
}
@media (max-width: 480px) {
  .device { border-radius: 0; box-shadow: none; }
}

/* EMBED MODE — strip outer chrome so the parent phone frame provides bezel.
   Also make the layout fill the iframe so bottom nav stays pinned. */
body.embed { background: transparent; height: 100vh; overflow: hidden; }
body.embed .stage { min-height: 0; padding: 0; height: 100vh; }
body.embed .device { border-radius: 0; box-shadow: none; width: 100%; height: 100%; display: flex; flex-direction: column; }
body.embed .screens { flex: 1; height: 100%; }
body.embed .screen { height: 100%; display: flex; flex-direction: column; }
body.embed .screen.is-hidden { display: none; }
body.embed .home-scroll, body.embed .detail-scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
body.embed .home-scroll { padding-bottom: 0; }
body.embed .detail-scroll { padding-bottom: 100px; }
body.embed .fab-pill-wrap { display: none; }
/* Always hide the legacy top pill — the image has its own */

/* Slide host */
.screens {
  position: relative;
  width: 100%;
  overflow: hidden;
}
/* Hide the floating action pill when on the detail view — header chrome takes over there */
.screens[data-view="detail"] ~ .fab-pill-wrap,
.device:has(.screens[data-view="detail"]) .fab-pill-wrap { display: none; }

/* Screen visibility */
.screen { transition: opacity 200ms ease; }
.screen.is-hidden {
  display: none;
  opacity: 0;
  pointer-events: none;
}
.screen {
  position: relative;
  width: 100%;
  display: block;
  transition: transform 380ms cubic-bezier(0.22, 1, 0.36, 1), opacity 320ms ease;
}

/* =========================================================
   FLOATING TOP ACTION PILL (search + bell + streak)
   ========================================================= */
.fab-pill-wrap {
  position: absolute;
  top: 12px;
  right: 16px;
  z-index: 30;
}
.fab-pill {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 7px 14px 7px 10px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 999px;
  box-shadow:
    0 8px 18px -8px oklch(0.18 0.03 175 / 0.18),
    0 2px 4px -1px oklch(0.18 0.03 175 / 0.06);
}
.fab-pill button {
  appearance: none;
  background: none;
  border: 0;
  padding: 6px;
  cursor: pointer;
  color: var(--ink-2);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 999px;
  transition: background 160ms ease;
}
.fab-pill button:hover { background: var(--bg-deep); color: var(--ink); }
.fab-pill .streak {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 4px 6px 4px 4px;
  margin-left: 2px;
  font-family: var(--sans);
  font-size: 14.5px;
  font-weight: 600;
  letter-spacing: -0.01em;
  color: var(--ink);
}
.fab-pill .streak svg { color: var(--warn); }

/* =========================================================
   HOME SCREEN — stitched screenshot + sticky overlays
   ========================================================= */
.home-scroll {
  padding: 0;
}
.stitched-home, .detail-image {
  position: relative;
  width: 100%;
}
.stitched-img-wrap {
  position: relative;
  width: 100%;
}
.stitched-img {
  display: block;
  width: 100%;
  height: auto;
  pointer-events: none;
  user-select: none;
}

/* Tappable hotspot overlay */
.hotspot {
  position: absolute;
  left: 4.5%;
  right: 4.5%;
  padding: 0;
  background: transparent;
  border: none;
  cursor: pointer;
  border-radius: 22px;
  z-index: 5;
  transition: background 200ms ease;
}
.hotspot:hover {
  background: oklch(0.5 0.05 175 / 0.04);
}
.hotspot:focus-visible {
  outline: 2px solid var(--teal);
  outline-offset: 2px;
}

/* Back-arrow invisible hotspot on detail screens */
.back-hotspot {
  position: absolute;
  background: transparent;
  border: none;
  cursor: pointer;
  z-index: 10;
}
.back-hotspot:focus-visible {
  outline: 2px solid var(--teal);
  outline-offset: 2px;
  border-radius: 50%;
}

/* Tap hint pill */
.stitched-tap-hint {
  position: absolute;
  right: 14px;
  bottom: 12px;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 6px 11px;
  border-radius: 999px;
  background: oklch(0.94 0.04 175 / 0.97);
  color: var(--teal-ink);
  font-family: var(--sans);
  font-size: 12px;
  font-weight: 500;
  letter-spacing: -0.005em;
  border: 1px solid oklch(0.85 0.06 175 / 0.7);
  box-shadow: 0 4px 12px -3px oklch(0.55 0.13 175 / 0.45);
  animation: hint-pulse 2.6s ease-in-out infinite;
  pointer-events: none;
}
.stitched-tap-hint svg { width: 11px; height: 11px; transition: transform 220ms ease; }
.hotspot:hover .stitched-tap-hint svg { transform: translateX(2px); }
@keyframes hint-pulse {
  0%, 100% { transform: translateY(0); box-shadow: 0 4px 10px -3px oklch(0.55 0.13 175 / 0.4); }
  50%      { transform: translateY(-2px); box-shadow: 0 8px 16px -4px oklch(0.55 0.13 175 / 0.6); }
}

/* =========================================================
   STICKY OVERLAYS — Real HTML chrome over scrollable image
   ========================================================= */

/* Top sticky pill: search + bell + streak — small, baseline-aligned with epti. wordmark */
.top-pill-overlay {
  position: absolute;
  top: 26px;
  right: 14px;
  display: inline-flex;
  align-items: center;
  gap: 0;
  padding: 3px 8px 3px 3px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 999px;
  box-shadow:
    0 1px 0 oklch(1 0 0 / 0.5) inset,
    0 4px 10px -4px oklch(0.18 0.03 175 / 0.12);
  z-index: 50;
}
.top-pill-overlay .tpo-btn {
  appearance: none;
  background: none;
  border: 0;
  padding: 4px;
  cursor: pointer;
  color: var(--ink-2);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 999px;
  transition: background 160ms ease;
}
.top-pill-overlay .tpo-btn svg { width: 12px; height: 12px; }
.top-pill-overlay .tpo-btn:hover { background: var(--bg-deep); color: var(--ink); }
.top-pill-overlay .tpo-streak {
  display: inline-flex;
  align-items: center;
  gap: 2px;
  margin-left: 2px;
  padding: 0 2px 0 1px;
  font-family: var(--sans);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: -0.01em;
  color: var(--ink);
}
.top-pill-overlay .tpo-streak svg { width: 10px; height: 10px; color: var(--warn); }

body.embed .top-pill-overlay {
  position: fixed;
  top: 26px;
  right: 14px;
}

/* The sticky FAB above the tab bar */
.fab-overlay {
  position: absolute;
  bottom: 100px;
  right: 18px;
  width: 60px;
  height: 60px;
  border-radius: 50%;
  background: var(--teal);
  color: white;
  border: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  box-shadow:
    0 1px 0 oklch(1 0 0 / 0.4) inset,
    0 14px 28px -10px oklch(0.55 0.13 175 / 0.6),
    0 6px 14px -4px oklch(0.55 0.13 175 / 0.4);
  cursor: pointer;
  z-index: 50;
  transition: transform 160ms ease;
}
.fab-overlay:hover { transform: translateY(-2px); }
.fab-overlay:active { transform: translateY(0) scale(0.97); }

/* Sticky bottom tab bar */
.tabbar-overlay {
  position: absolute;
  bottom: 14px;
  left: 14px;
  right: 14px;
  background: var(--card);
  border-radius: 999px;
  padding: 8px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  box-shadow:
    0 1px 0 oklch(1 0 0 / 0.5) inset,
    0 16px 32px -16px oklch(0.18 0.03 175 / 0.28),
    0 4px 12px -4px oklch(0.18 0.03 175 / 0.1);
  z-index: 40;
}

/* When embedded (in iframe), pin the overlays to the viewport so they stay put while user scrolls inside the iframe */
body.embed .fab-overlay {
  position: fixed;
  bottom: 100px;
}
body.embed .tabbar-overlay {
  position: fixed;
  bottom: 14px;
  left: 14px;
  right: 14px;
}

/* "Active Protocol" hero card */
.protocol-card {
  position: relative;
  background:
    radial-gradient(120% 60% at 0% 0%, oklch(0.97 0.03 175 / 0.7), transparent 60%),
    var(--card);
  border: 1px solid var(--line);
  border-radius: var(--r-xl);
  padding: 26px 22px 22px;
  box-shadow:
    0 1px 0 oklch(1 0 0 / 0.6) inset,
    0 10px 30px -18px oklch(0.18 0.03 175 / 0.18);
}

.section-label {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-family: var(--mono);
  font-size: 12.5px;
  font-weight: 500;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--ink-2);
}
.section-label .pill-icon {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: var(--teal-deep);
}

.protocol-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 22px;
}
.protocol-head h1 {
  font-family: var(--serif);
  font-weight: 500;
  font-size: 40px;
  line-height: 1;
  letter-spacing: -0.025em;
  margin: 10px 0 0;
  color: var(--ink);
}
.protocol-actions {
  display: flex;
  gap: 9px;
  margin-top: 8px;
}
.icon-btn {
  appearance: none;
  background: var(--bg-deep);
  border: 0;
  width: 42px;
  height: 42px;
  border-radius: 999px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  color: var(--ink-2);
  transition: background 160ms ease, transform 120ms ease;
}
.icon-btn:hover { background: var(--bg-deep); transform: translateY(-1px); }
.icon-btn.primary {
  background: var(--teal-tint);
  color: var(--teal-deep);
}
.icon-btn.primary:hover { background: oklch(0.92 0.06 175); }

/* DOSE / status pill cards */
.info-row {
  display: flex;
  gap: 12px;
  align-items: flex-start;
  padding: 14px 16px;
  background: var(--card-tint);
  border-radius: var(--r-md);
  margin-bottom: 12px;
}
.info-row .icon {
  width: 34px;
  height: 34px;
  flex-shrink: 0;
  border-radius: 50%;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: oklch(0.92 0.06 165);
  color: var(--green-ink);
}
.info-row .body {
  font-size: 15px;
  line-height: 1.45;
  letter-spacing: -0.01em;
  color: var(--ink-2);
  padding-top: 2px;
}
.info-row .body strong {
  color: var(--ink);
  font-weight: 600;
}
.info-row .body .k {
  font-family: var(--mono);
  font-size: 11.5px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-3);
  margin-right: 7px;
}

/* Stack title row */
.stack-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-top: 22px;
  cursor: pointer;
}
.stack-head h2 {
  flex: 1;
  font-family: var(--serif);
  font-weight: 500;
  font-size: 28px;
  line-height: 1.1;
  letter-spacing: -0.025em;
  margin: 0;
  color: var(--ink);
  display: flex;
  align-items: center;
  gap: 8px;
  white-space: nowrap;
  overflow: hidden;
}
.stack-head h2 .title {
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 210px;
}
.phase-tag {
  flex-shrink: 0;
  display: inline-flex;
  align-items: center;
  padding: 6px 12px;
  border-radius: 999px;
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.12em;
  font-weight: 600;
  text-transform: uppercase;
  color: var(--ink-2);
  background: var(--bg-deep);
}
.phase-tag.active { color: var(--teal-deep); background: var(--teal-tint); }
.chev {
  color: var(--ink-3);
  flex-shrink: 0;
  display: inline-flex;
}

.stack-meta {
  display: flex;
  align-items: center;
  gap: 4px;
  margin-top: 10px;
  font-family: var(--serif);
  font-style: italic;
  font-weight: 400;
  font-size: 16px;
  color: var(--ink-2);
}
.stack-meta .dot { width: 3px; height: 3px; border-radius: 50%; background: var(--ink-4); margin: 0 7px; }
.stack-meta .ok {
  color: var(--green-ink);
  font-style: normal;
  font-family: var(--sans);
  font-weight: 600;
}

/* Phase progress bar */
.phase-bar {
  display: flex;
  gap: 4px;
  margin: 16px 0 22px;
  height: 10px;
}
.phase-bar span {
  display: block;
  height: 100%;
  border-radius: 999px;
}
.phase-bar .p1 { flex: 1.2; background: var(--ph-1); }
.phase-bar .p2 { flex: 4.5; background: var(--ph-2); }
.phase-bar .p3 { flex: 0.4; background: var(--ph-3); opacity: 0.6; }
.phase-bar .p4 { flex: 0.6; background: var(--ph-4); }
.phase-bar .p5 { flex: 0.7; background: var(--ph-5); opacity: 0.55; }

/* =========================================================
   COMPOUND CARDS
   ========================================================= */
.compound-card {
  position: relative;
  display: grid;
  grid-template-columns: 110px 1fr 44px;
  gap: 10px;
  align-items: start;
  padding: 16px 16px 16px 6px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  margin-bottom: 12px;
  cursor: pointer;
  transition: transform 160ms ease, box-shadow 220ms ease, border-color 220ms ease;
  overflow: hidden;
}
.compound-card:last-child { margin-bottom: 0; }
.compound-card:hover {
  transform: translateY(-1px);
  border-color: var(--teal-line);
  box-shadow: 0 10px 28px -16px oklch(0.55 0.13 175 / 0.4);
}
.compound-card:active { transform: translateY(0) scale(0.995); }

/* one-time pulse on first load to draw the eye */
.compound-card.pulse-hint::before {
  content: "";
  position: absolute;
  inset: -1px;
  border-radius: var(--r-lg);
  border: 1.5px solid var(--teal);
  opacity: 0;
  pointer-events: none;
  animation: pulse-ring 2.4s ease-out 0.4s 2;
}
.compound-card:nth-child(2).pulse-hint::before { animation-delay: 0.65s; }
@keyframes pulse-ring {
  0%   { opacity: 0; transform: scale(0.985); }
  20%  { opacity: 0.7; transform: scale(1); }
  100% { opacity: 0; transform: scale(1.012); }
}

.bottle-wrap {
  position: relative;
  height: 150px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.bottle-wrap svg { width: 100px; height: 144px; display: block; }

.compound-body {
  padding-top: 6px;
  min-width: 0;
}
.compound-name {
  font-family: var(--sans);
  font-weight: 600;
  font-size: 26px;
  letter-spacing: -0.025em;
  color: var(--ink);
  margin: 0;
  line-height: 1.05;
}
.compound-dose {
  margin-top: 5px;
  font-family: var(--sans);
  font-size: 15px;
  color: var(--ink-3);
  letter-spacing: -0.005em;
}
.compound-dose .freq {
  font-family: var(--serif);
  font-style: italic;
  font-weight: 400;
  color: var(--ink-2);
  margin-left: 4px;
}

.in-body {
  margin-top: 10px;
  display: flex;
  align-items: baseline;
  gap: 6px;
}
.in-body .dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--green);
  align-self: center;
  box-shadow: 0 0 0 3px oklch(0.92 0.05 150 / 0.7);
  margin-right: 2px;
}
.in-body-stack {
  display: flex;
  flex-direction: column;
  line-height: 1;
}
.in-body-lbl {
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-3);
  margin-bottom: 6px;
}
.in-body-val {
  font-family: var(--sans);
  font-weight: 600;
  font-size: 22px;
  letter-spacing: -0.02em;
  color: var(--ink);
}
.in-body-pct {
  font-family: var(--serif);
  font-style: italic;
  font-size: 14.5px;
  color: var(--ink-3);
  margin-left: 5px;
  font-weight: 400;
}

/* Sparkline */
.spark {
  margin-top: 10px;
  height: 34px;
  width: 100%;
  display: block;
  color: var(--green);
}
.spark path.curve { fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
.spark path.base  { stroke: currentColor; stroke-width: 1; opacity: 0.35; }

/* Bottom row: days left + tap-for-details affordance */
.compound-foot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-top: 10px;
}
.days-left {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 10px 4px 8px;
  background: var(--warn-tint);
  border-radius: 999px;
  font-family: var(--sans);
  font-size: 12px;
  font-weight: 500;
  color: var(--warn-ink);
}
.days-left svg { width: 11px; height: 11px; }

.tap-hint {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 4px 8px;
  border-radius: 999px;
  background: oklch(0.94 0.04 175 / 0.8);
  color: var(--teal-ink);
  font-family: var(--sans);
  font-size: 11.5px;
  font-weight: 500;
  letter-spacing: -0.005em;
  border: 1px solid oklch(0.85 0.06 175 / 0.6);
}
.tap-hint svg {
  width: 11px;
  height: 11px;
  transition: transform 220ms ease;
}
.compound-card:hover .tap-hint svg { transform: translateX(2px); }

/* The right-column controls (check + ...) */
.compound-controls {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  padding-top: 4px;
}
.check-btn {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: var(--green);
  color: white;
  border: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  box-shadow:
    0 1px 0 oklch(1 0 0 / 0.4) inset,
    0 4px 10px -3px oklch(0.55 0.16 150 / 0.5);
}
.dots-btn {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--bg-deep);
  border: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: var(--ink-3);
  cursor: pointer;
}

/* corner expand glyph */
.expand-glyph {
  position: absolute;
  top: 10px;
  right: 50px;
  width: 18px;
  height: 18px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: var(--ink-4);
  opacity: 0.6;
  transition: opacity 200ms ease, color 200ms ease;
}
.compound-card:hover .expand-glyph { opacity: 1; color: var(--teal-deep); }

/* =========================================================
   COMPOSITION + BODY sections
   ========================================================= */
.section-divider {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 24px 6px 14px;
}
.section-divider .num {
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 500;
  letter-spacing: 0.16em;
  color: var(--ink-3);
  text-transform: uppercase;
}
.section-divider .num strong { color: var(--ink-2); }
.section-divider .chev { color: var(--ink-3); }

.goal-card {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 16px 18px;
  background: var(--card-tint);
  border-radius: var(--r-lg);
  margin: 0 4px 14px;
}
.goal-card .icon {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  background: oklch(0.92 0.06 165);
  color: var(--teal-deep);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.goal-card .label {
  font-family: var(--mono);
  font-size: 11.5px;
  font-weight: 500;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-3);
}
.goal-card .label strong {
  color: var(--ink);
  font-family: var(--sans);
  font-size: 16px;
  font-weight: 600;
  margin-left: 7px;
  letter-spacing: -0.005em;
  text-transform: none;
}
.goal-card .sub {
  font-size: 14px;
  color: var(--ink-3);
  margin-top: 3px;
}

.body-card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--r-xl);
  padding: 20px 18px 22px;
  margin: 0 4px;
  position: relative;
}
.body-card .kicker {
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.16em;
  color: oklch(0.55 0.16 285);
  text-transform: uppercase;
}
.body-card h3 {
  font-family: var(--serif);
  font-weight: 500;
  font-size: 32px;
  line-height: 1;
  letter-spacing: -0.02em;
  margin: 8px 0 0;
}

/* FAB */
.fab {
  position: absolute;
  bottom: 95px;
  right: 18px;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--teal);
  color: white;
  border: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  box-shadow:
    0 1px 0 oklch(1 0 0 / 0.4) inset,
    0 14px 28px -10px oklch(0.55 0.13 175 / 0.6);
  cursor: pointer;
  z-index: 5;
}

/* =========================================================
   BOTTOM NAV
   ========================================================= */
.tabbar {
  position: absolute;
  bottom: 14px;
  left: 14px;
  right: 14px;
  background: var(--card);
  border-radius: 999px;
  padding: 8px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  box-shadow:
    0 1px 0 oklch(1 0 0 / 0.5) inset,
    0 14px 30px -16px oklch(0.18 0.03 175 / 0.25),
    0 4px 10px -4px oklch(0.18 0.03 175 / 0.08);
  z-index: 4;
}
.tab {
  flex: 1;
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  padding: 6px 4px 4px;
  color: var(--ink);
  font-family: var(--sans);
  font-size: 11px;
  font-weight: 500;
  letter-spacing: -0.005em;
  cursor: pointer;
  background: transparent;
  border: 0;
  appearance: none;
}
.tab.active {
  background: oklch(0.97 0.02 175);
  border-radius: 999px;
  color: var(--teal-deep);
  box-shadow: 0 1px 0 oklch(1 0 0 / 0.7) inset, 0 2px 5px -1px oklch(0.18 0.03 175 / 0.1);
}
.tab svg { width: 22px; height: 22px; }
.tab.profile img {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  object-fit: cover;
  display: block;
}

/* =========================================================
   DETAIL SCREEN
   ========================================================= */
.detail-head {
  position: relative;
  padding: 20px 18px 8px;
  display: flex;
  align-items: center;
  gap: 12px;
  z-index: 31; /* sit above the floating top pill so back/title are never obscured */
  background: var(--bg);
}
.back-btn, .more-btn {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  background: var(--card);
  border: 1px solid var(--line);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  color: var(--ink);
  box-shadow: 0 4px 10px -4px oklch(0.18 0.03 175 / 0.12);
  flex-shrink: 0;
}
.detail-head h2 {
  flex: 1;
  text-align: center;
  font-family: var(--sans);
  font-weight: 600;
  font-size: 17px;
  letter-spacing: -0.015em;
  margin: 0;
}

.detail-scroll {
  padding: 14px 18px 110px;
}

.compound-toggle {
  display: flex;
  gap: 8px;
  margin-bottom: 16px;
}
.compound-toggle button {
  appearance: none;
  background: transparent;
  border: 0;
  padding: 9px 18px;
  border-radius: 999px;
  font-family: var(--sans);
  font-size: 14px;
  font-weight: 600;
  letter-spacing: -0.01em;
  color: var(--ink-2);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 7px;
  transition: background 200ms ease, color 200ms ease;
}
.compound-toggle button .d {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--green);
}
.compound-toggle button.active {
  background: var(--green-deep);
  color: white;
}
.compound-toggle button.active .d {
  background: white;
  box-shadow: 0 0 0 0 transparent;
}

.detail-card {
  background:
    radial-gradient(120% 60% at 100% 0%, var(--green-tint), transparent 65%),
    var(--card);
  border: 1px solid var(--line);
  border-radius: var(--r-xl);
  padding: 16px 14px 18px;
  display: grid;
  grid-template-columns: 108px 1fr;
  gap: 10px;
  align-items: center;
  margin-bottom: 20px;
}
.detail-card[data-c="warn"] {
  background:
    radial-gradient(120% 60% at 100% 0%, var(--warn-tint), transparent 65%),
    var(--card);
}
.detail-card .bottle-big {
  width: 108px;
  height: 152px;
  display: block;
}
.detail-card .info-side { padding-left: 2px; min-width: 0; }
.detail-card .name-line {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.detail-card .name-line h3 {
  font-family: var(--sans);
  font-weight: 700;
  font-size: 22px;
  letter-spacing: -0.02em;
  margin: 0;
  line-height: 1.05;
}
.detail-card .info-icon {
  color: var(--green-deep);
  display: inline-flex;
  cursor: pointer;
}
.detail-card[data-c="warn"] .info-icon { color: var(--warn-ink); }

.half-life {
  display: flex;
  align-items: flex-start;
  gap: 6px;
  font-family: var(--serif);
  font-style: italic;
  font-size: 13px;
  color: var(--ink-2);
  margin-top: 6px;
  line-height: 1.3;
}
.half-life svg { color: var(--ink-3); flex-shrink: 0; margin-top: 2px; }
.half-life span { display: block; }

.current-level {
  margin-top: 10px;
}
.current-level .lbl {
  font-family: var(--mono);
  font-size: 10.5px;
  font-weight: 500;
  letter-spacing: 0.14em;
  color: var(--ink-3);
  text-transform: uppercase;
}
.current-level .val {
  font-family: var(--sans);
  font-weight: 700;
  font-size: 26px;
  letter-spacing: -0.025em;
  color: var(--green-deep);
  margin-top: 3px;
  line-height: 1;
}
.detail-card[data-c="warn"] .current-level .val { color: var(--warn-ink); }

.fill-line {
  margin-top: 10px;
  display: flex;
  align-items: baseline;
  gap: 6px;
  flex-wrap: wrap;
}
.fill-line .total {
  font-family: var(--sans);
  font-weight: 700;
  font-size: 16px;
  letter-spacing: -0.015em;
  color: var(--ink);
}
.fill-line .sep { width: 3px; height: 3px; border-radius: 50%; background: var(--ink-4); align-self: center; }
.fill-line .pct {
  font-family: var(--serif);
  font-style: italic;
  font-weight: 500;
  font-size: 14.5px;
  color: var(--green-ink);
}
.detail-card[data-c="warn"] .fill-line .pct { color: var(--warn-ink); }

.doses-left {
  font-family: var(--serif);
  font-style: italic;
  font-size: 13px;
  color: var(--ink-3);
  margin-top: 4px;
}

.refill-btn {
  margin-top: 10px;
  appearance: none;
  background: oklch(0.96 0.04 150);
  border: 0;
  padding: 7px 16px 7px 12px;
  border-radius: 999px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-family: var(--sans);
  font-weight: 600;
  font-size: 13px;
  color: var(--green-ink);
  cursor: pointer;
}
.detail-card[data-c="warn"] .refill-btn {
  background: oklch(0.96 0.04 65);
  color: var(--warn-ink);
}

/* Range toggle */
.range-toggle {
  display: flex;
  background: var(--bg-deep);
  border-radius: 999px;
  padding: 4px;
  margin-bottom: 16px;
}
.range-toggle button {
  flex: 1;
  appearance: none;
  background: transparent;
  border: 0;
  padding: 10px;
  border-radius: 999px;
  font-family: var(--sans);
  font-weight: 600;
  font-size: 14px;
  letter-spacing: -0.01em;
  color: var(--ink-2);
  cursor: pointer;
  transition: background 200ms ease, color 200ms ease;
}
.range-toggle button.active {
  background: var(--green-deep);
  color: white;
  box-shadow: 0 6px 14px -6px oklch(0.55 0.16 150 / 0.5);
}
.detail-card[data-c="warn"] ~ .range-toggle button.active { background: var(--warn); }

/* Chart card */
.chart-card {
  background: var(--card);
  border-radius: var(--r-xl);
  padding: 16px 14px 18px;
  border: 1px solid var(--line);
  margin-bottom: 20px;
  position: relative;
}
.chart-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 12px;
}
.chart-head .lbl {
  font-family: var(--mono);
  font-size: 10.5px;
  font-weight: 500;
  letter-spacing: 0.14em;
  color: var(--ink-3);
  text-transform: uppercase;
}
.chart-head .tag {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-family: var(--mono);
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: 0.06em;
  color: var(--green-deep);
  background: var(--bg-deep);
  border-radius: 999px;
  padding: 3px 9px;
}
.chart-head .tag::before {
  content: "";
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--green);
}

.chart-svg {
  width: 100%;
  height: 220px;
  display: block;
}

.compare {
  padding: 0 4px;
  margin-bottom: 4px;
}
.compare .lbl {
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.14em;
  color: var(--ink-3);
  text-transform: uppercase;
}
.compare .row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 12px;
  padding: 10px 14px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  cursor: pointer;
}
.compare .row .d {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: var(--green);
}
.compare .row .nm {
  font-family: var(--sans);
  font-weight: 600;
  font-size: 14px;
  color: var(--ink);
}
.compare .row .add {
  margin-left: auto;
  color: var(--ink-3);
}

/* Stats footer row */
.stat-strip {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 8px;
  margin-top: 18px;
  margin-bottom: 14px;
}
.stat-cell {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  padding: 12px 12px 14px;
}
.stat-cell .lbl {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-family: var(--mono);
  font-size: 9.5px;
  font-weight: 500;
  letter-spacing: 0.12em;
  color: var(--ink-3);
  text-transform: uppercase;
}
.stat-cell .lbl .ico { color: var(--green-deep); display: inline-flex; }
.stat-cell .val {
  font-family: var(--sans);
  font-weight: 600;
  font-size: 17px;
  letter-spacing: -0.015em;
  color: var(--ink);
  margin-top: 8px;
  line-height: 1;
}
.stat-cell .val .u {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--ink-3);
  font-weight: 500;
  margin-left: 2px;
}

/* Small disclaimer */
.disclaimer {
  margin: 8px 4px 0;
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.04em;
  color: var(--ink-4);
  text-align: center;
  line-height: 1.4;
}

/* a11y */
button:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }

/* Bottle SVG accents */
.bottle-cap { fill: oklch(0.78 0.005 95); }
.bottle-cap-shade { fill: oklch(0.68 0.005 95); }
.bottle-glass { fill: oklch(0.97 0.01 150); }
.bottle-shine { fill: oklch(1 0 0); opacity: 0.5; }
.liquid { fill: var(--green); }
.liquid-warn { fill: var(--warn); }

/* =========================================================
   HOME v2 — Greeting, Daily Brief, multi-section feed
   ========================================================= */

/* additional tokens for new sections */
:root {
  --purple:       oklch(0.62 0.16 295);
  --purple-deep:  oklch(0.50 0.16 295);
  --purple-ink:   oklch(0.42 0.14 295);
  --purple-tint:  oklch(0.94 0.04 295);
  --purple-bg:    oklch(0.94 0.045 295);

  --coral:        oklch(0.68 0.18 25);
  --coral-deep:   oklch(0.58 0.18 25);
  --coral-ink:    oklch(0.50 0.16 25);
  --coral-tint:   oklch(0.96 0.045 25);

  --orange:       var(--warn);
  --orange-deep:  oklch(0.62 0.16 65);
  --orange-ink:   var(--warn-ink);
  --orange-tint:  var(--warn-tint);

  --blue:         oklch(0.65 0.13 240);
  --blue-deep:    oklch(0.52 0.14 240);
  --blue-ink:     oklch(0.45 0.13 240);
  --blue-tint:    oklch(0.95 0.03 240);

  --night-bg:     oklch(0.28 0.07 285);
  --night-bg-2:   oklch(0.22 0.08 285);
  --night-glow:   oklch(0.72 0.12 270);
}

/* Top header (wordmark + date + greeting) */
.app-header {
  padding: 64px 22px 12px;
  position: relative;
}
.epti-wordmark {
  display: flex;
  align-items: baseline;
  font-family: var(--serif);
  font-weight: 500;
  font-size: 54px;
  letter-spacing: -0.04em;
  color: var(--ink);
  line-height: 1;
}
.epti-wordmark .dot {
  display: inline-block;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: var(--teal);
  margin-left: 6px;
  align-self: center;
  transform: translateY(-2px);
  box-shadow: 0 0 0 5px oklch(0.92 0.06 175 / 0.7);
}
.date-row {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  margin-top: 30px;
  font-family: var(--mono);
  font-size: 13.5px;
  font-weight: 500;
  letter-spacing: 0.14em;
  color: var(--ink-3);
  text-transform: uppercase;
  white-space: nowrap;
}
.date-row svg { color: var(--ink-4); width: 14px; height: 14px; }
.greeting-line {
  font-family: var(--serif);
  font-weight: 500;
  font-size: 56px;
  line-height: 1;
  letter-spacing: -0.03em;
  color: var(--ink);
  margin: 16px 0 22px;
}
.divider {
  height: 1px;
  background: var(--line);
  margin: 0 22px;
}

/* Section header (numbered) */
.sec-divider {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 28px 22px 18px;
  cursor: pointer;
}
.sec-divider .num {
  font-family: var(--mono);
  font-size: 13.5px;
  font-weight: 500;
  letter-spacing: 0.16em;
  color: var(--ink-3);
  text-transform: uppercase;
}
.sec-divider .num strong { color: var(--ink-2); }
.sec-divider .chev { color: var(--ink-3); display: inline-flex; }

/* =========================================================
   DAILY BRIEF CARD (purple)
   ========================================================= */
.brief-card {
  position: relative;
  margin: 0 18px 16px;
  background:
    radial-gradient(120% 60% at 100% 0%, oklch(0.92 0.06 295 / 0.7), transparent 70%),
    var(--purple-bg);
  border-radius: var(--r-xl);
  padding: 22px 22px 22px;
  overflow: hidden;
}
.brief-kicker {
  display: inline-flex;
  align-items: center;
  gap: 9px;
  font-family: var(--mono);
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--purple-deep);
  white-space: nowrap;
  padding-right: 90px;
}
.brief-kicker .num { font-weight: 700; }
.brief-kicker .sep { width: 18px; height: 1px; background: currentColor; opacity: 0.4; }
.brief-card .refresh {
  position: absolute;
  top: 18px;
  right: 18px;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: oklch(0.92 0.05 295 / 0.7);
  border: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: var(--purple-deep);
  cursor: pointer;
}
.brief-card .chev-up {
  position: absolute;
  top: 22px;
  right: 66px;
  color: var(--purple-deep);
  opacity: 0.7;
}
.brief-hey {
  font-family: var(--serif);
  font-weight: 500;
  font-size: 30px;
  letter-spacing: -0.025em;
  margin: 14px 0 18px;
  color: var(--ink);
  line-height: 1.1;
}
.brief-rule {
  height: 1px;
  background: oklch(0.82 0.04 295 / 0.6);
  margin: 0 -22px 20px;
}
.brief-headline {
  font-family: var(--serif);
  font-weight: 600;
  font-size: 32px;
  line-height: 1.1;
  letter-spacing: -0.025em;
  color: var(--ink);
  margin: 0 0 18px;
}
.brief-body {
  font-size: 16px;
  line-height: 1.5;
  letter-spacing: -0.005em;
  color: var(--ink-2);
  margin: 0 0 22px;
}

/* Adjustments list */
.adj-card {
  background: oklch(0.97 0.025 65 / 0.7);
  border-radius: var(--r-lg);
  padding: 16px 16px 16px;
  margin-bottom: 16px;
}
.adj-head {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 12px;
}
.adj-head .icon {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  background: oklch(0.92 0.06 65);
  color: var(--orange-deep);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.adj-head .lbl {
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.14em;
  color: var(--orange-deep);
  text-transform: uppercase;
}
.adj-head .meta {
  font-family: var(--mono);
  font-size: 10.5px;
  font-weight: 500;
  letter-spacing: 0.12em;
  color: var(--orange-ink);
  margin-left: auto;
  text-transform: uppercase;
  opacity: 0.7;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  max-width: 140px;
}
.adj-head .sep { color: var(--orange-ink); opacity: 0.4; }
.adj-list { display: flex; flex-direction: column; gap: 8px; }
.adj-item {
  display: grid;
  grid-template-columns: 32px 1fr auto auto;
  gap: 12px;
  align-items: center;
  padding: 8px 4px;
}
.adj-item .ico {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: oklch(0.94 0.05 65);
  color: var(--orange-ink);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.adj-item .label {
  font-size: 16px;
  font-weight: 500;
  letter-spacing: -0.005em;
  color: var(--ink);
  line-height: 1.3;
}
.adj-yes, .adj-no {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  border: 1.5px solid currentColor;
  background: transparent;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  opacity: 0.6;
}
.adj-yes { color: var(--orange-deep); }
.adj-no { color: var(--orange-deep); }

.apply-row {
  display: flex;
  gap: 10px;
  margin-top: 16px;
}
.btn-apply {
  appearance: none;
  border: 0;
  padding: 12px 22px;
  border-radius: 999px;
  font-family: var(--sans);
  font-weight: 600;
  font-size: 13.5px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 7px;
}
.btn-apply.primary {
  background: var(--orange-deep);
  color: white;
}
.btn-apply.secondary {
  background: transparent;
  color: var(--orange-ink);
  border: 1.5px solid oklch(0.85 0.08 65);
}

/* Watch For callout */
.watch-for {
  margin-top: 20px;
  padding: 16px 16px 16px 18px;
  background: oklch(0.96 0.03 295);
  border-radius: var(--r-md);
  border-left: 3px solid var(--purple);
}
.watch-for .lbl {
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--purple-deep);
  margin-bottom: 8px;
}
.watch-for .body {
  font-size: 15.5px;
  line-height: 1.5;
  color: var(--ink-2);
}

/* Discuss link */
.discuss {
  margin-top: 16px;
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 14px 16px;
  background: oklch(0.96 0.035 295);
  border-radius: var(--r-md);
  cursor: pointer;
}
.discuss .avatar {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--purple) 0%, oklch(0.55 0.16 240) 100%);
  color: white;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-weight: 600;
  font-size: 14px;
  flex-shrink: 0;
}
.discuss .copy { flex: 1; }
.discuss .lbl {
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.16em;
  color: var(--purple-deep);
  text-transform: uppercase;
}
.discuss .title {
  font-family: var(--sans);
  font-weight: 600;
  font-size: 17px;
  letter-spacing: -0.01em;
  color: var(--purple-deep);
  margin-top: 2px;
}
.discuss .arrow { color: var(--purple-deep); flex-shrink: 0; }

/* Daily tasks footer chip */
.tasks-chip {
  margin: 14px 18px 0;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 14px 16px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 999px;
  cursor: pointer;
}
.tasks-chip .num {
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 700;
  color: var(--orange-deep);
  letter-spacing: 0.08em;
}
.tasks-chip .sep { width: 14px; height: 1px; background: var(--orange-deep); opacity: 0.4; }
.tasks-chip .lbl {
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.14em;
  color: var(--orange-deep);
  text-transform: uppercase;
}
.tasks-chip .count {
  font-family: var(--mono);
  font-size: 10.5px;
  font-weight: 600;
  color: var(--ink-3);
  background: var(--bg-deep);
  padding: 3px 8px;
  border-radius: 999px;
}
.tasks-chip .next {
  font-size: 14.5px;
  color: var(--ink-2);
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.tasks-chip .dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--teal);
  box-shadow: 0 0 0 3px var(--teal-tint);
}

/* =========================================================
   WEIGHT LOSS / Coral card
   ========================================================= */
.metric-card {
  position: relative;
  margin: 0 18px 16px;
  background:
    radial-gradient(120% 60% at 0% 0%, oklch(0.97 0.03 25 / 0.6), transparent 70%),
    var(--card);
  border: 1px solid oklch(0.92 0.03 25);
  border-radius: var(--r-xl);
  padding: 22px;
  overflow: hidden;
}
.metric-kicker {
  font-family: var(--mono);
  font-size: 12.5px;
  font-weight: 600;
  letter-spacing: 0.18em;
  text-transform: uppercase;
}
.metric-kicker.coral { color: var(--coral-deep); }
.metric-kicker.teal  { color: var(--teal-deep); }
.metric-kicker.orange{ color: var(--orange-deep); }
.metric-kicker.blue  { color: var(--blue-deep); }
.metric-kicker.purple{ color: var(--purple-deep); }
.metric-head {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 10px;
  margin-top: 6px;
}
.metric-head h3 {
  font-family: var(--serif);
  font-weight: 500;
  font-size: 38px;
  letter-spacing: -0.025em;
  line-height: 1;
  margin: 8px 0 0;
}
.metric-head .sub {
  font-family: var(--serif);
  font-style: italic;
  font-size: 15px;
  color: var(--ink-3);
  margin-top: 6px;
}
.metric-head .icon-chev {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  margin-bottom: 4px;
  color: var(--ink-3);
}
.metric-head .icon-chev .badge {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: oklch(0.94 0.04 25);
  color: var(--coral-deep);
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
.metric-stats {
  display: grid;
  grid-template-columns: 1fr 1px 1fr 1px 1fr;
  gap: 14px;
  margin-top: 22px;
  padding-top: 18px;
  border-top: 1px solid oklch(0.92 0.02 25 / 0.7);
}
.metric-stats .v {
  font-family: var(--sans);
  font-weight: 600;
  font-size: 32px;
  letter-spacing: -0.03em;
  line-height: 1;
}
.metric-stats .v.coral { color: var(--coral-deep); }
.metric-stats .v.arrow::before {
  content: "↗";
  font-size: 0.8em;
  margin-right: 1px;
}
.metric-stats .l {
  margin-top: 8px;
  font-family: var(--sans);
  font-size: 13.5px;
  color: var(--ink-3);
}
.metric-stats .vbar {
  width: 1px;
  height: 32px;
  background: oklch(0.88 0.02 25);
  align-self: center;
}

.progress-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 22px;
  font-size: 14.5px;
  color: var(--ink-3);
}
.progress-row .pct { font-weight: 600; font-size: 15.5px; }
.progress-bar {
  margin-top: 10px;
  height: 8px;
  background: oklch(0.94 0.025 25);
  border-radius: 999px;
  overflow: hidden;
}
.progress-bar > span {
  display: block;
  height: 100%;
  border-radius: 999px;
}
.progress-bar > span.coral  { background: var(--coral); }
.progress-bar > span.teal   { background: var(--teal); }
.progress-bar > span.orange { background: var(--orange); }

/* shared variant — when the kicker is teal/orange/blue, swap background gradients */
.metric-card.teal {
  background: radial-gradient(120% 60% at 0% 0%, oklch(0.96 0.04 175 / 0.5), transparent 70%), var(--card);
  border-color: oklch(0.90 0.03 175);
}
.metric-card.teal .progress-bar { background: oklch(0.94 0.03 175); }
.metric-card.teal .metric-stats { border-top-color: oklch(0.92 0.02 175 / 0.7); }
.metric-card.teal .metric-head .icon-chev .badge { background: oklch(0.94 0.04 175); color: var(--teal-deep); }

.metric-card.orange {
  background: radial-gradient(120% 60% at 0% 0%, oklch(0.96 0.04 65 / 0.55), transparent 70%), var(--card);
  border-color: oklch(0.92 0.03 65);
}
.metric-card.orange .progress-bar { background: oklch(0.94 0.03 65); }
.metric-card.orange .metric-stats { border-top-color: oklch(0.92 0.02 65 / 0.7); }

.metric-card.blue {
  background: radial-gradient(120% 60% at 0% 0%, oklch(0.96 0.03 240 / 0.5), transparent 70%), var(--card);
  border-color: oklch(0.92 0.02 240);
}

/* Activity ring (right side of Today card) */
.ring {
  position: relative;
  width: 100px;
  height: 100px;
  flex-shrink: 0;
}
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 6; stroke-linecap: round; }
.ring .track { stroke: oklch(0.94 0.02 175); }
.ring .fill  { stroke: var(--teal); transition: stroke-dashoffset 600ms ease; }
.ring .center {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-family: var(--sans);
  text-align: center;
}
.ring .center .pct {
  font-weight: 600;
  font-size: 17px;
  color: var(--ink);
}
.ring .center svg { width: 22px; height: 22px; transform: none; color: var(--teal-deep); }

.today-card .body-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  margin-top: 6px;
}
.today-card .big-num {
  font-family: var(--serif);
  font-weight: 500;
  font-size: 66px;
  letter-spacing: -0.035em;
  line-height: 1;
  color: var(--ink);
}
.today-card .sub {
  font-family: var(--serif);
  font-style: italic;
  font-size: 14.5px;
  color: var(--ink-3);
  margin-top: 10px;
}
.today-card .triple {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 10px;
  margin-top: 16px;
  padding-top: 14px;
  border-top: 1px solid oklch(0.92 0.02 175 / 0.7);
}
.today-card .triple .l {
  font-family: var(--mono);
  font-size: 9.5px;
  font-weight: 600;
  letter-spacing: 0.14em;
  color: var(--ink-3);
  text-transform: uppercase;
}
.today-card .triple .v {
  font-family: var(--sans);
  font-weight: 600;
  font-size: 22px;
  letter-spacing: -0.025em;
  margin-top: 5px;
  color: var(--ink);
}
.today-card .triple .v .u { font-family: var(--mono); font-size: 12.5px; color: var(--ink-3); font-weight: 500; margin-left: 1px; }
.today-card .triple > div { border-left: 2px solid var(--teal); padding-left: 8px; }
.today-card .triple > div:first-child { border-left-color: var(--teal); }
.today-card .triple > div:nth-child(2) { border-left-color: var(--orange); }
.today-card .triple > div:nth-child(3) { border-left-color: var(--coral); }

/* Move/Activity card with bigger ring + legend */
.move-card .top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  margin-bottom: 14px;
}
.move-card h3 { font-family: var(--serif); font-weight: 500; font-size: 36px; margin: 8px 0 0; letter-spacing: -0.025em; line-height: 1; }
.move-card .icon-chev .badge { background: oklch(0.94 0.04 65); color: var(--orange-deep); }

.move-row {
  display: flex;
  align-items: center;
  gap: 16px;
}
.ring-lg { width: 140px; height: 140px; flex-shrink: 0; }
.ring-lg circle { stroke-width: 9; }
.ring-lg .track { stroke: oklch(0.94 0.02 65); }
.ring-lg .fill  { stroke: var(--orange); }
.ring-lg .center .pct { font-size: 22px; font-weight: 600; line-height: 1; }
.ring-lg .center .lbl {
  font-family: var(--mono);
  font-size: 9px;
  font-weight: 600;
  letter-spacing: 0.16em;
  color: var(--ink-3);
  margin-top: 3px;
}

.move-legend { flex: 1; display: flex; flex-direction: column; gap: 6px; }
.move-legend .ll {
  display: flex;
  align-items: baseline;
  gap: 8px;
  font-size: 14px;
}
.move-legend .ll svg { color: var(--ink-3); }
.move-legend .ll .nm { color: var(--ink-2); font-weight: 500; flex: 1; }
.move-legend .ll .v { font-weight: 600; color: var(--ink); }
.move-legend .ll .u { color: var(--ink-3); font-family: var(--mono); font-size: 11.5px; }
.move-legend .ll .d { width: 7px; height: 7px; border-radius: 50%; }
.move-legend .ll .d.green { background: var(--green); }
.move-legend .ll .d.orange { background: var(--orange); }
.move-legend .rest {
  font-family: var(--serif);
  font-style: italic;
  font-size: 13px;
  color: var(--ink-3);
  margin-top: 4px;
}

.eaten-row {
  margin-top: 16px;
  padding-top: 12px;
  border-top: 1px solid oklch(0.92 0.02 65 / 0.7);
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 13px;
  color: var(--ink-2);
}
.eaten-row .deficit { color: var(--orange-deep); font-weight: 600; margin-left: auto; }
.log-link {
  margin-top: 12px;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--orange-deep);
  cursor: pointer;
}
.log-link::before { content: "+"; font-size: 14px; font-weight: 700; }

/* =========================================================
   TRAIN / Rest Day
   ========================================================= */
.train-card { padding-bottom: 16px; }
.train-card .top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  margin-bottom: 14px;
}
.train-card h3 { font-family: var(--serif); font-weight: 500; font-size: 32px; margin: 8px 0 0; letter-spacing: -0.025em; line-height: 1; }
.train-card .top-icons { display: flex; gap: 8px; align-items: center; color: var(--blue-deep); }
.train-card .top-icons .btn {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: oklch(0.94 0.03 240);
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
.train-card .chev { color: var(--ink-3); }
.rest-row {
  display: grid;
  grid-template-columns: 44px 1fr;
  gap: 14px;
  align-items: flex-start;
  padding: 6px 0;
}
.rest-row .icon {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: oklch(0.94 0.04 65);
  color: var(--orange-deep);
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
.rest-row .title-text {
  font-family: var(--serif);
  font-weight: 600;
  font-size: 26px;
  letter-spacing: -0.02em;
  margin: 0 0 5px;
}
.rest-row .body {
  font-size: 15px;
  line-height: 1.45;
  color: var(--ink-2);
}
.edit-split {
  margin-top: 14px;
  padding-top: 12px;
  border-top: 1px solid var(--line);
  display: flex;
  align-items: center;
  gap: 8px;
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--blue-deep);
  cursor: pointer;
}
.edit-split .arr { margin-left: auto; }

/* =========================================================
   SLEEP CARD (dark)
   ========================================================= */
.sleep-card {
  margin: 0 18px 16px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--r-xl);
  padding: 16px;
  overflow: hidden;
}
.sleep-hero {
  position: relative;
  background:
    radial-gradient(60% 60% at 90% 30%, oklch(0.78 0.08 280 / 0.5), transparent 60%),
    linear-gradient(160deg, var(--night-bg) 0%, var(--night-bg-2) 100%);
  border-radius: var(--r-lg);
  padding: 18px 20px 20px;
  color: white;
  overflow: hidden;
}
/* starfield (tiny dots) */
.sleep-hero::before {
  content: "";
  position: absolute;
  inset: 0;
  background-image:
    radial-gradient(1px 1px at 20% 30%, oklch(0.95 0.02 280) 50%, transparent),
    radial-gradient(1px 1px at 70% 20%, oklch(0.92 0.02 280 / 0.7) 50%, transparent),
    radial-gradient(1px 1px at 35% 70%, oklch(0.92 0.02 280 / 0.6) 50%, transparent),
    radial-gradient(1.2px 1.2px at 60% 50%, oklch(0.95 0.02 280 / 0.8) 50%, transparent),
    radial-gradient(1px 1px at 50% 80%, oklch(0.92 0.02 280 / 0.5) 50%, transparent);
  pointer-events: none;
}
.sleep-moon {
  position: absolute;
  top: -16px;
  right: -18px;
  width: 90px;
  height: 90px;
  border-radius: 50%;
  background:
    radial-gradient(circle at 30% 30%, oklch(0.96 0.02 280), oklch(0.80 0.05 280) 60%, oklch(0.55 0.10 280));
  box-shadow: 0 0 60px oklch(0.78 0.12 270 / 0.5);
  opacity: 0.85;
}
.sleep-head {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: space-between;
  z-index: 1;
}
.sleep-head .l {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.16em;
  color: oklch(0.85 0.04 280);
  text-transform: uppercase;
}
.sleep-head .last {
  font-family: var(--serif);
  font-style: italic;
  font-size: 13px;
  color: oklch(0.85 0.04 280);
  text-transform: none;
  letter-spacing: 0;
}
.sleep-head .score {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 9px;
  border: 1px solid oklch(0.95 0.02 280 / 0.6);
  border-radius: 999px;
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.1em;
  color: oklch(0.95 0.02 280);
  background: oklch(0.4 0.1 280 / 0.4);
}
.sleep-time {
  position: relative;
  z-index: 1;
  font-family: var(--sans);
  font-weight: 300;
  font-size: 68px;
  letter-spacing: -0.04em;
  color: white;
  margin: 18px 0 14px;
  display: inline-flex;
  align-items: baseline;
  gap: 2px;
  line-height: 1;
}
.sleep-time .min { font-size: 36px; color: oklch(0.85 0.04 280); margin-left: 4px; }
.sleep-time .min .colon { opacity: 0.7; margin-right: 1px; }
.sleep-time .u { font-size: 26px; color: oklch(0.85 0.04 280); margin-left: 6px; font-weight: 400; }

.sleep-bar {
  position: relative;
  height: 12px;
  background: oklch(0.42 0.10 280 / 0.5);
  border-radius: 999px;
  overflow: hidden;
  z-index: 1;
}
.sleep-bar .fill {
  height: 100%;
  width: 92%;
  background: linear-gradient(90deg, oklch(0.50 0.18 285), oklch(0.72 0.14 250));
  border-radius: 999px;
}
.sleep-bar .marker {
  position: absolute;
  top: 0;
  left: 80%;
  width: 2px;
  height: 100%;
  background: oklch(0.95 0 0 / 0.85);
}
.sleep-goal {
  position: relative;
  z-index: 1;
  margin-top: 6px;
  display: flex;
  justify-content: flex-end;
}
.sleep-goal span {
  font-family: var(--sans);
  font-size: 12px;
  color: oklch(0.92 0.03 280);
  background: oklch(0.32 0.10 280 / 0.7);
  padding: 3px 10px;
  border-radius: 999px;
}

.sleep-week {
  margin-top: 14px;
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 6px;
}
.sleep-week .day {
  height: 36px;
  border-radius: 8px;
  background: oklch(0.78 0.10 175);
}
.sleep-week .day.today { background: linear-gradient(180deg, oklch(0.70 0.15 285), oklch(0.55 0.18 285)); }
.sleep-week-labels {
  margin-top: 8px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 4px;
}
.sleep-debt {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 10px 4px 8px;
  border-radius: 999px;
  background: var(--coral-tint);
  color: var(--coral-deep);
  font-size: 12px;
  font-weight: 600;
}
.sleep-week-labels .dl {
  display: flex;
  gap: 10px;
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 600;
  color: var(--ink-4);
  letter-spacing: 0.12em;
}
.sleep-note {
  margin-top: 14px;
  padding: 12px 14px;
  background: oklch(0.96 0.025 285);
  border-radius: var(--r-md);
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 13.5px;
  line-height: 1.4;
  color: var(--ink-2);
  cursor: pointer;
}
.sleep-note .icon {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: oklch(0.92 0.05 285);
  color: var(--purple-deep);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.sleep-note .icon svg { width: 12px; height: 12px; }
.sleep-note .arr { color: var(--ink-3); margin-left: auto; flex-shrink: 0; }

/* =========================================================
   NUTRITION CARD
   ========================================================= */
.nutri-head { display: flex; align-items: flex-start; justify-content: space-between; }
.nutri-head h3 { font-family: var(--serif); font-weight: 500; font-size: 36px; margin: 8px 0 0; letter-spacing: -0.025em; line-height: 1; }
.nutri-head .badge {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: oklch(0.94 0.04 65);
  color: var(--orange-deep);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 4px;
}
.nutri-stat {
  margin-top: 18px;
  display: flex;
  align-items: baseline;
  justify-content: space-between;
}
.nutri-stat .big {
  font-family: var(--serif);
  font-weight: 500;
  font-size: 54px;
  letter-spacing: -0.035em;
  line-height: 1;
  color: var(--ink);
}
.nutri-stat .big .u { font-family: var(--mono); font-size: 16px; color: var(--ink-3); margin-left: 2px; font-weight: 500; }
.nutri-stat .left {
  text-align: right;
}
.nutri-stat .left .v {
  font-family: var(--sans);
  font-weight: 600;
  font-size: 26px;
  color: var(--teal-deep);
  line-height: 1;
  letter-spacing: -0.025em;
}
.nutri-stat .left .lbl {
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.14em;
  color: var(--ink-3);
  text-transform: uppercase;
  margin-top: 4px;
}
.nutri-bar {
  margin-top: 16px;
  height: 8px;
  background: oklch(0.94 0.025 65);
  border-radius: 999px;
  overflow: hidden;
}
.nutri-bar .fill { height: 100%; background: var(--orange); width: 56%; border-radius: 999px; }
.macros {
  margin-top: 14px;
  display: grid;
  grid-template-columns: 1fr 1px 1fr 1px 1fr;
  gap: 12px;
  align-items: center;
}
.macros .vbar { width: 1px; height: 22px; background: var(--line); align-self: center; }
.macro {
  display: flex;
  align-items: baseline;
  gap: 6px;
  font-size: 13.5px;
}
.macro .d { width: 7px; height: 7px; border-radius: 50%; align-self: center; }
.macro .d.p { background: var(--orange); }
.macro .d.c { background: var(--green); }
.macro .d.f { background: var(--purple); }
.macro .nm { font-weight: 600; color: var(--ink-3); font-family: var(--mono); font-size: 12px; letter-spacing: 0.05em; }
.macro .v { font-weight: 700; color: var(--ink); }
.macro .t { color: var(--ink-3); font-family: var(--mono); font-size: 11.5px; }

/* =========================================================
   WATER CARD
   ========================================================= */
.water-card { margin: 0 18px 16px; background: var(--card); border: 1px solid var(--line); border-radius: var(--r-xl); padding: 20px; }
.water-head { display: flex; align-items: center; gap: 12px; }
.water-head h3 { font-family: var(--sans); font-weight: 600; font-size: 24px; letter-spacing: -0.02em; margin: 0; color: var(--ink); flex: 1; }
.water-head .ico { color: var(--blue-deep); }
.water-head .filter { color: var(--ink-3); }
.water-body { display: grid; grid-template-columns: 110px 1fr; gap: 18px; margin-top: 16px; align-items: center; }
.water-bottle { position: relative; }
.water-bottle svg { width: 110px; height: 170px; display: block; }
.water-stat .row { display: flex; align-items: baseline; gap: 6px; }
.water-stat .big {
  font-family: var(--sans);
  font-weight: 600;
  font-size: 28px;
  letter-spacing: -0.025em;
  color: var(--ink);
}
.water-stat .of { color: var(--ink-3); }
.water-stat .togo {
  font-size: 13px;
  color: var(--ink-3);
  margin-top: 4px;
  margin-bottom: 12px;
}
.water-adds { display: flex; flex-direction: column; gap: 6px; }
.water-add {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 10px 14px;
  background: var(--blue-tint);
  border-radius: 999px;
  font-family: var(--sans);
  font-weight: 600;
  font-size: 14px;
  color: var(--blue-deep);
  cursor: pointer;
}
.water-add svg { color: var(--blue-deep); }

/* utility: pretty-text */
.brief-body, .rest-row .body, .sleep-note { text-wrap: pretty; }

</style>
